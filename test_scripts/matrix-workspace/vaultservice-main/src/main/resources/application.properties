# Application name
spring.application.name=${SPRING_APPLICATION_NAME:vaultservice}

# Server port
server.port = ${SERVER_PORT:6020}

# Logging
logging.level.com.example=${LOGGING_LEVEL:INFO}
service.http.connect.timeout=${SERVICE_HTTP_CONNECT_TIMEOUT:5000}
service.http.read.timeout=${SERVICE_HTTP_READ_TIMEOUT:10000}

# DB config
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.database=${SPRING_JPA_DATABASE:postgresql}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# CORS origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:6080}

# SECRET KEYS
ENCRYPTION_KEY=${ENCRYPTION_KEY}
BOOTSTRAP_TOKEN=${BOOTSTRAP_TOKEN}
# Integration function start: Auth
AUTH_CICD_TOKEN=${AUTH_CICD_TOKEN} # Integration line: Auth
EMAIL_CICD_TOKEN=${EMAIL_CICD_TOKEN} # Integration line: Email
FILE_CICD_TOKEN=${FILE_CICD_TOKEN} # Integration line: File
GATEWAY_CICD_TOKEN=${GATEWAY_CICD_TOKEN} # Integration line: Gateway
LOGGER_CICD_TOKEN=${LOGGER_CICD_TOKEN} # Integration line: Logger
REACT_CICD_TOKEN=${REACT_CICD_TOKEN} # Integration line: React
TELEMETRY_CICD_TOKEN=${TELEMETRY_CICD_TOKEN} # Integration line: Telemetry
JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
JWT_ISSUER=${JWT_ISSUER}
SERVICE_SECRET_VAULT=${SERVICE_SECRET_VAULT}
# Integration function end: Auth
