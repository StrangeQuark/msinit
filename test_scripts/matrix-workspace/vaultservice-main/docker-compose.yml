services:
  vault-service:
    build: .
    networks:
      - shared-network
      - vaultdb-network
    ports:
      - "6020:6020"
    container_name: vault-service
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    labels:
      com.msinit.log: "true"
      com.msinit.service-name: "vaultservice"
    depends_on:
      - vault-db
    environment:
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME}
      - SERVER_PORT=${SERVER_PORT}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - LOGGING_LEVEL=${LOGGING_LEVEL}
      - SERVICE_HTTP_CONNECT_TIMEOUT=${SERVICE_HTTP_CONNECT_TIMEOUT}
      - SERVICE_HTTP_READ_TIMEOUT=${SERVICE_HTTP_READ_TIMEOUT}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_DRIVER=${SPRING_DATASOURCE_DRIVER}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}
      - SPRING_JPA_DATABASE=${SPRING_JPA_DATABASE}
      - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AUTH_CICD_TOKEN=${AUTH_CICD_TOKEN} # Integration line: Auth
      - EMAIL_CICD_TOKEN=${EMAIL_CICD_TOKEN} # Integration line: Email
      - FILE_CICD_TOKEN=${FILE_CICD_TOKEN} # Integration line: File
      - GATEWAY_CICD_TOKEN=${GATEWAY_CICD_TOKEN} # Integration line: Gateway
      - LOGGER_CICD_TOKEN=${LOGGER_CICD_TOKEN} # Integration line: Logger
      - REACT_CICD_TOKEN=${REACT_CICD_TOKEN} # Integration line: React
      - TELEMETRY_CICD_TOKEN=${TELEMETRY_CICD_TOKEN} # Integration line: Telemetry
      - BOOTSTRAP_TOKEN=${BOOTSTRAP_TOKEN}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY} # Integration line: Auth
      - JWT_ISSUER=${JWT_ISSUER} # Integration line: Auth
      - SERVICE_SECRET_VAULT=${SERVICE_SECRET_VAULT} # Integration line: Auth
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6020/api/vault/health" ]
      interval: 10s
      timeout: 5s
      retries: 20
  vault-db:
    image: 'postgres:13.1-alpine@sha256:16af09e480c49226f8e7cd4d602ab27e59f434eb255d2b45bd0cfe1defb86fd7'
    container_name: vault-db
    restart: unless-stopped
    volumes:
      - vault-db-volume:/var/lib/postgresql/data
    networks:
      - vaultdb-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
networks:
  vaultdb-network:
    internal: true
  shared-network:
    external: true
volumes:
  vault-db-volume:
