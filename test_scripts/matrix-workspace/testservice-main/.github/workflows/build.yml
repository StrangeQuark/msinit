
name: TestService CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, linux-agent]

    env:
      VAULT_URL: ${{ secrets.VAULT_URL }}
      CICD_TOKEN: ${{ secrets.CICD_TOKEN }}
      VAULTSERVICE_ENABLED: ${{ secrets.VAULTSERVICE_ENABLED }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Retrieve Env Vars
        run: |
          if [ "$VAULTSERVICE_ENABLED" = "true" ]; then
            echo "Requesting environment variables from Vault..."

            response=$(curl -sS --fail-with-body \
              -X POST \
              -H "X-CICD-TOKEN: $CICD_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"serviceName":"testservice","environmentName":"e3"}' \
              "$VAULT_URL/api/vault/cicd") || {
                echo "Unable to retrieve environment variables from Vault"
                exit 1
              }

            if [ -z "$response" ]; then
              echo "Vault returned an empty environment file"
              exit 1
            fi

            printf '%s\n' "$response" > testservice.env
            echo "Environment variables written to testservice.env"
          fi

      - name: Deploy & Test
        run: |
          set -e
          docker compose --env-file testservice.env up --build || {
            echo "Deployment crashed."
            docker compose down
            exit 1
          }

      - name: Shutdown containers
        if: always()
        run: |
          docker compose down

      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results/report.html
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          rm -f testservice.env
          echo "Cleaned up testservice.env"
          docker compose down -v
