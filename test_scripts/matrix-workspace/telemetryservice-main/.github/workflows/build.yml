name: TelemetryService Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux-agent]

    env:
      VAULT_URL: ${{ secrets.VAULT_URL }}
      CICD_TOKEN: ${{ secrets.TELEMETRY_CICD_TOKEN }}
      VAULTSERVICE_ENABLED: ${{ secrets.VAULTSERVICE_ENABLED }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Retrieve Env Vars from Vault
        run: |
          if [ "$VAULTSERVICE_ENABLED" = "true" ]; then
            echo "Requesting environment variables from Vault..."

            response=$(curl -sS --fail-with-body \
              -X POST \
              -H "X-CICD-TOKEN: $CICD_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"serviceName":"telemetryservice","environmentName":"e3"}' \
              "$VAULT_URL/api/vault/cicd") || {
                echo "Unable to retrieve environment variables from Vault"
                exit 1
              }

            if [ -z "$response" ]; then
              echo "Vault returned an empty environment file"
              exit 1
            fi

            printf '%s\n' "$response" > telemetryservice.env

            echo "Environment variables written to telemetryservice.env"
          fi
      - name: Deploy & Health Check
        run: |
          set -e

          docker compose --env-file telemetryservice.env up --build -d

          max_retries=40
          retry_interval=15
          success=0

          for i in $(seq 1 $max_retries); do
            echo "Health check attempt $i..."

            if response=$(curl -sS -f http://localhost:6050/api/telemetry/health) && [ "$response" = "200 OK" ]; then
              echo "Telemetryservice is healthy"
              success=1
              break
            else
              echo "Health check failed, retrying in $retry_interval seconds..."
              sleep $retry_interval
            fi
          done

          if [ $success -ne 1 ]; then
            echo "Health check ultimately failed. Tearing down containers."
            docker compose down
            exit 1
          fi
      - name: Cleanup
        if: always()
        run: |
          rm -f telemetryservice.env
          echo "Cleaned up telemetryservice.env"
