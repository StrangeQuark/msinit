services:
  react-service:
    build:
      context: .
      args:
        DUMMY_ARG: "DUMMY_ARG"
        VITE_AUTH_API_BASE_URL: ${VITE_AUTH_API_BASE_URL}
        VITE_EMAIL_API_BASE_URL: ${VITE_EMAIL_API_BASE_URL}
        VITE_FILE_API_BASE_URL: ${VITE_FILE_API_BASE_URL}
        VITE_VAULT_API_BASE_URL: ${VITE_VAULT_API_BASE_URL}
        VITE_GATEWAY_BASE_URL: ${VITE_GATEWAY_BASE_URL}
        VITE_AUTHSERVICE_INTEGRATION: ${VITE_AUTHSERVICE_INTEGRATION}
        VITE_EMAILSERVICE_INTEGRATION: ${VITE_EMAILSERVICE_INTEGRATION}
        VITE_FILESERVICE_INTEGRATION: ${VITE_FILESERVICE_INTEGRATION}
        VITE_VAULTSERVICE_INTEGRATION: ${VITE_VAULTSERVICE_INTEGRATION}
        VITE_GATEWAYSERVICE_INTEGRATION: ${VITE_GATEWAYSERVICE_INTEGRATION}
    networks:
      - shared-network
    ports:
      - "6080:80"
    container_name: react-service
    environment:
      CSP_ALLOWED_SOURCES: ${CSP_ALLOWED_SOURCES}
    labels:
      com.msinit.log: "true"
      com.msinit.service-name: "reactservice"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 10s
      timeout: 5s
      retries: 20
networks:
  shared-network:
    external: true
