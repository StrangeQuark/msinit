services:
  gateway-service:
    build: .
    networks:
      - shared-network
      - gateway-redis-network
    ports:
      - "8080:8080"
    container_name: gateway-service
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    labels:
      com.msinit.log: "true"
      com.msinit.service-name: "gatewayservice"
    environment:
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME}
      - SERVER_PORT=${SERVER_PORT}
      - JENKINS_SERVICE_URL=${JENKINS_SERVICE_URL}
      - JENKINSSERVICE_INTEGRATION=${JENKINSSERVICE_INTEGRATION}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - AUTHSERVICE_INTEGRATION=${AUTHSERVICE_INTEGRATION}
      - EMAIL_SERVICE_URL=${EMAIL_SERVICE_URL}
      - EMAILSERVICE_INTEGRATION=${EMAILSERVICE_INTEGRATION}
      - FILE_SERVICE_URL=${FILE_SERVICE_URL}
      - FILESERVICE_INTEGRATION=${FILESERVICE_INTEGRATION}
      - VAULT_SERVICE_URL=${VAULT_SERVICE_URL}
      - VAULTSERVICE_INTEGRATION=${VAULTSERVICE_INTEGRATION}
      - TELEMETRY_SERVICE_URL=${TELEMETRY_SERVICE_URL}
      - TELEMETRYSERVICE_INTEGRATION=${TELEMETRYSERVICE_INTEGRATION}
      - REACT_SERVICE_URL=${REACT_SERVICE_URL}
      - REACTSERVICE_INTEGRATION=${REACTSERVICE_INTEGRATION}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - HOSTS=${HOSTS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CONNECT_TIMEOUT=${REDIS_CONNECT_TIMEOUT}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT}
      - AUTH_GATEWAY_RATE_LIMIT_REPLENISH_RATE=${AUTH_GATEWAY_RATE_LIMIT_REPLENISH_RATE}
      - AUTH_GATEWAY_RATE_LIMIT_BURST_CAPACITY=${AUTH_GATEWAY_RATE_LIMIT_BURST_CAPACITY}
#      - SERVER_SSL_ENABLED=${SERVER_SSL_ENABLED} # Uncomment for prod deployments
#      - SERVER_SSL_KEY_STORE=${SERVER_SSL_KEY_STORE} # Uncomment for prod deployments
#      - SERVER_SSL_KEY_STORE_PASSWORD=${SERVER_SSL_KEY_STORE_PASSWORD} # Uncomment for prod deployments
#      - SERVER_SSL_KEY_STORE_TYPE=${SERVER_SSL_KEY_STORE_TYPE} # Uncomment for prod deployments
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/gateway/health" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      gateway-redis:
        condition: service_started
  gateway-redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    container_name: gateway-redis
    restart: unless-stopped
    networks:
      - gateway-redis-network
    volumes:
      - gateway-redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 20
networks:
  shared-network:
    external: true
  gateway-redis-network:
    internal: true
volumes:
  gateway-redis-data:
