# Disable SSL for unit tests
server.ssl.enabled=false
hosts=jenkins=jenkins.test

jenkinsservice.integration=true
authservice.integration=true
emailservice.integration=true
fileservice.integration=true
vaultservice.integration=true
telemetryservice.integration=true
reactservice.integration=true

# Redis rate-limit config
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_PASSWORD=change-me
REDIS_CONNECT_TIMEOUT=10s
REDIS_TIMEOUT=10s
AUTH_GATEWAY_RATE_LIMIT_REPLENISH_RATE=5
AUTH_GATEWAY_RATE_LIMIT_BURST_CAPACITY=60
